<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stepwise is an interactive lab for algorithms and data structures. Watch sorting, searching, and pathfinding run step by step, with synchronized code and honest counters."
    />
    <meta name="theme-color" content="#efeee7" />
    <title>Stepwise - understand code, one step at a time</title>
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('stepwise.settings.v1')
          const settings = raw ? JSON.parse(raw) : {}
          let theme = settings.theme || 'light'
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = theme
        } catch {
          /* first visit */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
